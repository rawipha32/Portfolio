<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เว็บไซต์ของฉัน</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .box {
            max-width: 800px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ccc;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- เปลี่ยนรูปตรงนี้ -->
        <img src="https://placehold.co/300x300" alt="รูปของฉัน">

        <!-- เปลี่ยนชื่อ -->
        <h1>ชื่อของฉัน</h1>

        <!-- เปลี่ยนคำแนะนำตัว -->
        <p>สวัสดี นี่คือเว็บไซต์ของฉัน</p>

        <!-- เปลี่ยนลิงก์ -->
        <a href="#">Facebook</a>
        <a href="#">GitHub</a>
        <a href="#">Instagram</a>

    </div>

</body>

</html>
